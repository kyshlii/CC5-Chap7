<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Reviewer Game</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#d8f3dc,#b7e4c7,#95d5b2);
    color:#1b4332;
}

.container{
    max-width:950px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#2d6a4f;
    font-size:3rem;
}

.subtitle{
    text-align:center;
    color:#40916c;
}

input{
    width:90%;
    padding:15px;
    border-radius:15px;
    border:2px solid #95d5b2;
    font-size:1rem;
    display:block;
    margin:20px auto;
}

button{
    border:none;
    border-radius:15px;
    padding:14px 30px;
    background:#2d6a4f;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#40916c;
}

.control{
    display:block;
    margin:20px auto;
}

.timer{
    text-align:center;
    font-size:1.5rem;
    font-weight:bold;
    margin:15px;
}

.progress-container{
    width:100%;
    background:#d8f3dc;
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

.progress-bar{
    height:18px;
    width:0%;
    background:#2d6a4f;
    transition:0.4s;
}

.question-box{
    background:#ecfdf3;
    border:3px solid #95d5b2;
    border-radius:20px;
    padding:25px;
}

.question{
    font-size:1.4rem;
    font-weight:bold;
    margin-bottom:20px;
}

.answers button{
    width:100%;
    margin:10px 0;
    background:#b7e4c7;
    color:#1b4332;
}

.correct{
    background:#2ecc71 !important;
    color:white !important;
}

.wrong{
    background:#e74c3c !important;
    color:white !important;
}

.score{
    text-align:center;
    margin-top:20px;
    font-size:1.3rem;
    font-weight:bold;
}

.next-btn{
    display:none;
}

.result{
    text-align:center;
    font-size:2rem;
    color:#2d6a4f;
}

.hidden{
    display:none;
}

iframe{
    display:none;
}

</style>
</head>

<body>

<iframe id="bgMusic"
src=""
allow="autoplay"
style="display:none;">
</iframe>

<div class="container">

<div id="startScreen">

<h1>🌿 AI Reviewer Game</h1>

<p class="subtitle">
Artificial Intelligence Interactive Quiz
</p>

<input type="text"
id="playerName"
placeholder="Enter your name">

<button class="control"
onclick="playMusic()">
Play Music 🎵
</button>

<button class="control"
onclick="startGame()">
Start Game
</button>

</div>

<div id="gameScreen" class="hidden">

<h1>🌿 AI Quiz</h1>

<p class="subtitle"
id="welcomeText"></p>

<div id="timer"
class="timer">
Time Left: 30
</div>

<div class="progress-container">
<div id="progressBar"
class="progress-bar"></div>
</div>

<div class="question-box">

<div id="question"
class="question"></div>

<div id="answers"
class="answers"></div>

</div>

<div id="score"
class="score">
Score: 0
</div>

<button id="nextBtn"
class="control next-btn">
Next Question
</button>

</div>

</div>

<script>

function playMusic(){

document.getElementById("bgMusic").src =
"https://open.spotify.com/track/4z928BtE4j1bjhcX9RU44M?si=b865e4e51d294879";

}

let questions = [

{
question:"A hospital uses AI to identify diseases from X-ray images. Which AI area is used?",
answers:[
{text:"Computer Vision", correct:true},
{text:"Natural Language Processing", correct:false},
{text:"Robotics", correct:false},
{text:"Networking", correct:false}
]
},

{
question:"Which machine learning type uses labeled data?",
answers:[
{text:"Supervised Learning", correct:true},
{text:"Unsupervised Learning", correct:false},
{text:"Reinforcement Learning", correct:false},
{text:"Manual Learning", correct:false}
]
},

{
question:"Which AI field focuses on human language?",
answers:[
{text:"Natural Language Processing", correct:true},
{text:"Computer Vision", correct:false},
{text:"Robotics", correct:false},
{text:"Manufacturing", correct:false}
]
},

{
question:"What is deep learning?",
answers:[
{text:"A subset of machine learning using neural networks", correct:true},
{text:"A type of hardware", correct:false},
{text:"A browser", correct:false},
{text:"A spreadsheet", correct:false}
]
},

{
question:"Which is an ethical concern in AI?",
answers:[
{text:"Bias and discrimination", correct:true},
{text:"Keyboard brightness", correct:false},
{text:"Printer speed", correct:false},
{text:"Mouse size", correct:false}
]
}

];

questions.sort(() => Math.random() - 0.5);

let currentQuestion = 0;
let score = 0;
let timeLeft = 30;
let timer;
let player = "";

const startScreen =
document.getElementById("startScreen");

const gameScreen =
document.getElementById("gameScreen");

const questionElement =
document.getElementById("question");

const answersElement =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

const scoreElement =
document.getElementById("score");

const timerElement =
document.getElementById("timer");

const progressBar =
document.getElementById("progressBar");

const welcomeText =
document.getElementById("welcomeText");

function startGame(){

player =
document.getElementById("playerName").value;

if(player.trim() === ""){
player = "Player";
}

startScreen.classList.add("hidden");

gameScreen.classList.remove("hidden");

welcomeText.innerText =
"Good luck, " + player + "!";

showQuestion();

}

function playSound(type){

const audioCtx =
new(window.AudioContext ||
window.webkitAudioContext)();

const oscillator =
audioCtx.createOscillator();

const gainNode =
audioCtx.createGain();

oscillator.connect(gainNode);

gainNode.connect(audioCtx.destination);

if(type === "correct"){
oscillator.frequency.value = 800;
}

else if(type === "wrong"){
oscillator.frequency.value = 180;
}

else if(type === "time"){
oscillator.frequency.value = 120;
}

oscillator.type = "sine";

oscillator.start();

gainNode.gain.exponentialRampToValueAtTime(
0.00001,
audioCtx.currentTime + 0.4
);

setTimeout(()=>{
oscillator.stop();
},400);

}

function startTimer(){

clearInterval(timer);

timeLeft = 30;

timerElement.innerText =
"Time Left: " + timeLeft;

timer = setInterval(()=>{

timeLeft--;

timerElement.innerText =
"Time Left: " + timeLeft;

if(timeLeft <= 10){
timerElement.style.color = "#e74c3c";
}

else{
timerElement.style.color = "#2d6a4f";
}

if(timeLeft <= 0){

clearInterval(timer);

timeUp();

}

},1000);

}

function showQuestion(){

resetState();

startTimer();

let q = questions[currentQuestion];

questionElement.innerText =
"Question " +
(currentQuestion + 1) +
" of " +
questions.length +
": " +
q.question;

q.answers.forEach(answer=>{

const button =
document.createElement("button");

button.innerText =
answer.text;

button.addEventListener("click",()=>{

selectAnswer(
button,
answer.correct
);

});

answersElement.appendChild(button);

});

updateProgress();

}

function resetState(){

nextBtn.style.display = "none";

answersElement.innerHTML = "";

}

function selectAnswer(button,correct){

clearInterval(timer);

const buttons =
answersElement.children;

Array.from(buttons).forEach(btn=>{

btn.disabled = true;

});

if(correct){

button.classList.add("correct");

score++;

scoreElement.innerText =
"Score: " + score;

playSound("correct");

}

else{

button.classList.add("wrong");

playSound("wrong");

Array.from(buttons)
.forEach((btn,index)=>{

if(
questions[currentQuestion]
.answers[index].correct
){

btn.classList.add("correct");

}

});

}

nextBtn.style.display = "block";

}

function timeUp(){

const buttons =
answersElement.children;

Array.from(buttons)
.forEach((btn,index)=>{

btn.disabled = true;

if(
questions[currentQuestion]
.answers[index].correct
){

btn.classList.add("correct");

}

});

playSound("time");

nextBtn.style.display = "block";

}

function updateProgress(){

let progress =
((currentQuestion) /
questions.length) * 100;

progressBar.style.width =
progress + "%";

}

nextBtn.addEventListener("click",()=>{

currentQuestion++;

if(currentQuestion <
questions.length){

showQuestion();

}

else{

showResult();

}

});

function showResult(){

clearInterval(timer);

resetState();

progressBar.style.width = "100%";

timerElement.style.display = "none";

let message = "";

if(score >= 4){

message =
"Excellent, " +
player +
"! AI Master 🌟";

}

else{

message =
"Review again, " +
player +
" 📘";

}

questionElement.innerHTML = `
<div class="result">

🌿 Quiz Complete!

<br><br>

Your Score:
${score}/${questions.length}

<br><br>

${message}

</div>
`;

nextBtn.innerText = "Play Again";

nextBtn.style.display = "block";

nextBtn.onclick = ()=>{

location.reload();

};

}

</script>

</body>
</html>
